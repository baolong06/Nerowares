name: Supply-chain security

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  sca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install declared dependencies and SCA tools
        run: |
          python -m pip install --upgrade pip
          python - <<'PY'
          import tomllib
          from pathlib import Path

          document = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          requirements = list(document["project"].get("dependencies") or [])
          extras = document["project"].get("optional-dependencies") or {}
          for extra in ("dev", "security", "data"):
              requirements.extend(extras.get(extra) or [])
          output = Path("artifacts/ci-requirements.txt")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text("\n".join(requirements) + "\n", encoding="utf-8")
          PY
          python -m pip install -r artifacts/ci-requirements.txt

      - name: Compile check
        run: python -m py_compile src/config.py src/config_vault.py src/api/mfa.py src/api/security.py src/api/ratelimit.py src/api/shared_state.py src/data/manifest.py src/data/source.py src/data/huggingface.py src/data/catalog.py src/data/resolve.py src/data/release/*.py scripts/dataset_release.py scripts/check_cve.py scripts/check_secrets.py scripts/generate_sbom.py scripts/create_sample_data.py scripts/dataset_verify.py scripts/dataset_download.py scripts/dataset_info.py

      - name: Validate bundled sample data
        run: python scripts/create_sample_data.py --check

      - name: Generate declared SBOM
        run: python scripts/generate_sbom.py --mode declared --output artifacts/sbom-declared.cdx.json

      - name: Generate ambient SBOM
        run: python scripts/generate_sbom.py --mode ambient --output artifacts/sbom-ambient.cdx.json

      - name: Pytest (full regression, no raw dataset download)
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: PYTHONPATH=. pytest -q

      - name: Upload SBOMs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: |
            artifacts/sbom-declared.cdx.json
            artifacts/sbom-ambient.cdx.json
          if-no-files-found: error

      - name: pip-audit (declared project graph)
        run: python -m pip_audit -r artifacts/ci-requirements.txt --progress-spinner off --strict

      - name: pip-audit (ambient evidence, non-blocking)
        run: python -m pip_audit -l --progress-spinner off --format json > artifacts/ambient-pip-audit.json || true

      - name: Local CVE library check (fail-closed)
        run: python scripts/check_cve.py

      - name: Gitleaks CLI scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Secret scan (local fallback contract)
        run: python scripts/check_secrets.py

      - name: Artifact manifest signature check
        env:
          THINKING_ARTIFACT_VERIFY_KEY: ${{ secrets.THINKING_ARTIFACT_VERIFY_KEY }}
        run: |
          if [ -n "${THINKING_ARTIFACT_VERIFY_KEY:-}" ] && [ -f artifacts/bciciv2a-full/artifact_manifest.json ]; then
            printf '%s' "$THINKING_ARTIFACT_VERIFY_KEY" > /tmp/thinking-verify-key.pem
            python -c "from pathlib import Path; from scripts.artifact_manifest import verify_manifest_signature; manifest = Path('artifacts/bciciv2a-full/artifact_manifest.json'); key = Path('/tmp/thinking-verify-key.pem').read_bytes(); ok = verify_manifest_signature(manifest, key); print('artifact manifest signature verified' if ok else 'artifact manifest signature verification failed'); raise SystemExit(0 if ok else 1)"
          else
            echo "Verification key or generated manifest unavailable; artifact signing remains a release requirement"
          fi
