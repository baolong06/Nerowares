name: Verify family reproducibility

on:
  workflow_dispatch:
    inputs:
      family:
        description: "Approved dataset family (D01–D19)"
        required: true
        type: string
      release_manifest:
        description: "Repository-relative signed family release JSON (sidecar beside it)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-family:
    runs-on: [self-hosted, linux, dataset-reproducibility]
    timeout-minutes: 120
    concurrency:
      group: reproducibility-${{ github.repository }}
      cancel-in-progress: false
    environment: dataset-reproducibility
    env:
      REQUESTED_FAMILY: ${{ inputs.family }}
      RELEASE_MANIFEST_PATH: ${{ inputs.release_manifest }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install verifier dependencies
        run: |
          python -m pip install -e ".[data]"
          python -m pip install cryptography==49.0.0

      - name: Verify approved signed family and pinned shards
        env:
          THINKING_HF_DATASET_TOKEN: ${{ secrets.THINKING_HF_DATASET_TOKEN }}
          THINKING_RELEASE_VERIFY_KEY: ${{ secrets.THINKING_RELEASE_VERIFY_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import sys
          from pathlib import Path

          from huggingface_hub import hf_hub_download
          from src.data.huggingface import preflight_download_quota, verify_release_manifest
          from src.data.release.governance import load_release_config
          from src.data.release.inventory import hash_file

          def check_path(value, root):
              path = Path(value)
              if path.is_absolute() or "\\" in value or any(part in (".", "..") for part in value.split("/")):
                  raise ValueError("invalid manifest path")
              resolved = (root / path).resolve(strict=True)
              if not resolved.is_relative_to(root) or not resolved.is_file():
                  raise ValueError("manifest is not a repository file")
              return resolved

          try:
              token = os.environ.pop("THINKING_HF_DATASET_TOKEN", "")
              public_key = os.environ.pop("THINKING_RELEASE_VERIFY_KEY", "").encode("utf-8")
              family = os.environ["REQUESTED_FAMILY"]
              if not re.fullmatch(r"D(0[1-9]|1[0-9])", family):
                  raise ValueError("invalid family")
              root = Path.cwd().resolve()
              release_path = check_path(os.environ["RELEASE_MANIFEST_PATH"], root)
              signature_path = check_path(release_path.relative_to(root).as_posix() + ".ed25519.sig", root)
              if not public_key.strip():
                  raise ValueError("missing verification key")
              if not token.strip():
                  raise ValueError("missing dataset credential")
              verified = verify_release_manifest(
                  manifest_path=release_path,
                  signature_path=signature_path,
                  verification_key=public_key,
              )
              if (verified.dataset_id != family or verified.manifest.provider != "huggingface"
                      or not verified.manifest.governance.can_upload):
                  raise ValueError("family is not approved for verification")
              config = load_release_config(root / "dataset_catalog/families.release.json")
              approved = next((item for item in config.families if item.dataset_id == family), None)
              if (approved is None or not approved.governance.can_upload
                      or approved.repo_id != verified.repo_id
                      or approved.release_id != verified.release_id
                      or approved.scope_status != verified.scope_status
                      or approved.governance != verified.manifest.governance):
                  raise ValueError("family has no matching current governance approval")
              if not verified.file_count:
                  raise ValueError("signed inventory is empty")
              cache_root = os.environ.get("RUNNER_TEMP")
              if not cache_root:
                  raise ValueError("RUNNER_TEMP not set")
              cache = Path(cache_root) / "thinking-family-cache"
              max_cache_bytes = 80_000_000_000
              min_free_bytes = 10_000_000_000
              preflight_download_quota(
                  total_size_bytes=verified.total_size_bytes,
                  cache_dir=cache,
                  max_cache_bytes=max_cache_bytes,
                  min_free_bytes=min_free_bytes,
              )
              cache.mkdir(parents=True, exist_ok=True)
              # Inventory-only verification: no raw EEG parsing or scientific claim.
              for record in verified.manifest.files:
                  downloaded = Path(hf_hub_download(
                      repo_id=verified.repo_id,
                      repo_type="dataset",
                      filename=record.path,
                      revision=verified.revision,
                      cache_dir=str(cache),
                      token=token,
                  ))
                  size, digest = hash_file(downloaded)
                  if (size, digest) != (record.size_bytes, record.sha256):
                      raise ValueError("shard verification failed")

              lineage = {
                  "dataset_id": family,
                  "release_id": verified.release_id,
                  "repo_id": verified.repo_id,
                  "revision": verified.revision,
                  "scope_status": verified.scope_status,
                  "governance_status": verified.governance_status,
                  "manifest_signature_status": verified.manifest_signature_status,
                  "manifest_sha256": verified.manifest_sha256,
                  "file_count": verified.file_count,
                  "total_size_bytes": verified.total_size_bytes,
                  "verification_status": "verified",
              }
              output = Path("artifacts/reproducibility/lineage.json")
              output.parent.mkdir(parents=True, exist_ok=True)
              output.write_text(json.dumps(lineage, sort_keys=True) + "\n", encoding="utf-8")
              print("Signed family inventory and all cached shards verified")
          except Exception:
              print("Family verification failed; no lineage published", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Publish non-sensitive lineage only
        uses: actions/upload-artifact@v4
        with:
          name: verified-family-lineage
          path: artifacts/reproducibility/lineage.json
          if-no-files-found: error
